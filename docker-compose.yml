services:
  efris:
    image: axoblade/flawless-on-prem
    container_name: flawless-app
    restart: always
    ports:
      - "3005:3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - MONGO_URL=mongodb://mongo:27017/flawless
      - LOGS_URL=mongodb://mongo:27017/flawless_logs
    depends_on:
      - mongo
    networks:
      - flawless-net

  mongo:
    image: mongo:6.0
    container_name: mongo
    restart: always
    volumes:
      - mongo-data:/data/db
    networks:
      - flawless-net
  postgres:
    image: postgres:16-alpine
    container_name: palmaccounts-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - pgdata_local_all:/var/lib/postgresql/data
    networks:
      - flawless-net

  api:
    image: axoblade/palmaccounts-api #fixerug/palm-api
    container_name: palm-api
    depends_on:
      - postgres
    ports:
      - "3001:3000"
    environment:
      PORT: 3000
      COOKIE_SECURE: 0
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/postgres"
      SHARED_DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/palmaccounts_global"
      CORS_ORIGINS: "http://localhost:3002,http://localhost:3003,http://pos:3002,http://admin:3003,https://localhost:3002,https://213.199.50.216:3002,https://213.199.50.216:3003,https://serverone:3002,https://serverone:3001,https://serverone:3003,http://serverone:3002,http://serverone:3001,http://serverone:3003,http://213.199.50.216:3003,http://213.199.50.216:3002"
    networks:
      - flawless-net

  pos:
    image: axoblade/palmaccounts-pos #fixerug/palm-pos
    container_name: palm-pos
    depends_on:
      - api
    ports:
      - "3002:3000"
    environment:
      PORT: 3000
      PUBLIC_INTERNAL_API_BASE_URL: "http://api:3000"
      DISABLE_CSRF: "1"
      PUBLIC_API_PORT: 3001
      COOKIE_SECURE: 0
      CORS_ORIGINS: "http://localhost:3002,http://localhost:3003,http://pos:3002,http://admin:3003,https://localhost:3002,https://213.199.50.216:3002,https://213.199.50.216:3003,https://serverone:3002,https://serverone:3001,https://serverone:3003,http://serverone:3002,http://serverone:3001,http://serverone:3003,http://213.199.50.216:3003,http://213.199.50.216:3002"
    networks:
      - flawless-net

  admin:
    image: axoblade/palmaccounts-admin #fixerug/palm-admin
    container_name: palm-admin
    depends_on:
      - api
    ports:
      - "3003:3000"
    environment:
      PORT: 3000
      PUBLIC_INTERNAL_API_BASE_URL: "http://api:3000"
      PUBLIC_API_PORT: 3001
      COOKIE_SECURE: 0
      DISABLE_CSRF: "1"
      BODY_SIZE_LIMIT: "50M"
      CORS_ORIGINS: "http://localhost:3002,http://localhost:3003,http://pos:3002,http://admin:3003,https://localhost:3002,https://213.199.50.216:3002,https://213.199.50.216:3003,https://serverone:3002,https://serverone:3001,https://serverone:3003,http://serverone:3002,http://serverone:3001,http://serverone:3003,http://213.199.50.216:3003,http://213.199.50.216:3002"
    networks:
      - flawless-net

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@palmaccounts.com
      PGADMIN_DEFAULT_PASSWORD: password
    ports:
      - "5050:80"
    networks:
      - flawless-net

volumes:
  mongo-data:
  pgdata_local_all:

networks:
  flawless-net:
    driver: bridge
