services:
  redis:
    image: redis:7-alpine
    container_name: palm-redis
    restart: unless-stopped
    networks:
      - palm-net

  api:
    # TEMPORARY: pointing at the new-palm-test-branch test images (built by
    # deploy-new-palm-test-branch.yml) instead of the palm-prod-v1 images.
    image: fixerug/palmaccounts-new-test-api:${API_TAG:-new-test-api}
    container_name: palm-api
    restart: unless-stopped
    depends_on:
      - redis
    ports:
      - "${API_PORT:-5000}:8080"
    env_file:
      - .env
    # Postgres runs on the host OS, outside Docker (managed independently of this stack).
    # host-gateway lets the container reach it via host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__GlobalDatabase: "Host=${DB_HOST};Port=${DB_PORT:-5432};Database=${DB_NAME:-palmaccounts_global};Username=${DB_USER};Password=${DB_PASSWORD}"
      SHARED_DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT:-5432}/${DB_NAME:-palmaccounts_global}"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "${JWT_ISSUER:-PalmAccounts}"
      # Frontends are reached both via the box's LAN address and via localhost (for
      # anyone browsing from the box itself), so both are allowed here.
      Cors__Origins__0: "http://${LAN_HOST}:${POS_PORT:-3002}"
      Cors__Origins__1: "http://${LAN_HOST}:${ERP_PORT:-3003}"
      Cors__Origins__2: "http://${LAN_HOST}:${PLATFORM_PORT:-3004}"
      Cors__Origins__3: "http://${LAN_HOST}:${PALM_CAFE_PORT:-3005}"
      Cors__Origins__4: "http://localhost:${POS_PORT:-3002}"
      Cors__Origins__5: "http://localhost:${ERP_PORT:-3003}"
      Cors__Origins__6: "http://localhost:${PLATFORM_PORT:-3004}"
      Cors__Origins__7: "http://localhost:${PALM_CAFE_PORT:-3005}"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - palm-net

  erp:
    # TEMPORARY: new-palm-test-branch test image.
    image: fixerug/palmaccounts-new-erp-test:${ERP_TAG:-new-test-api}
    container_name: palm-erp
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - .env
    # Skip the image's default entrypoint (it requires an HTTPS API_UPSTREAM
    # hostname for Dokploy/cloud deploys); serve the mounted LAN-only conf instead.
    entrypoint: ["nginx", "-g", "daemon off;"]
    ports:
      - "${ERP_PORT:-3003}:80"
    volumes:
      - ./nginx/erp.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - palm-net

  pos:
    # TEMPORARY: new-palm-test-branch test image.
    image: fixerug/palmaccounts-new-pos-test:${POS_TAG:-new-test-api}
    container_name: palm-pos
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - .env
    entrypoint: ["nginx", "-g", "daemon off;"]
    ports:
      - "${POS_PORT:-3002}:80"
    volumes:
      - ./nginx/pos.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - palm-net

  platform:
    # TEMPORARY: new-palm-test-branch test image.
    image: fixerug/palmaccounts-new-platform-test:${PLATFORM_TAG:-new-test-api}
    container_name: palm-platform
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - .env
    entrypoint: ["nginx", "-g", "daemon off;"]
    ports:
      - "${PLATFORM_PORT:-3004}:80"
    volumes:
      - ./nginx/platform.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - palm-net

  palm-cafe:
    # TEMPORARY: new-palm-test-branch test image.
    image: fixerug/palmaccounts-new-palm-cafe-test:${PALM_CAFE_TAG:-new-test-api}
    container_name: palm-cafe
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - .env
    entrypoint: ["nginx", "-g", "daemon off;"]
    ports:
      - "${PALM_CAFE_PORT:-3005}:80"
    volumes:
      - ./nginx/palm-cafe.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - palm-net

networks:
  palm-net:
    driver: bridge
